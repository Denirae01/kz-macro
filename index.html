:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --line:#26303b;
  --text:#e6edf3; --muted:#7d8590; --up:#3fb950; --down:#f85149; --accent:#d29922;
}
*{box-sizing:border-box}
.app{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-feature-settings:'tnum' 1,'cv05' 1;
}
.num,.card-delta,.bd-val,.bd-delta,.ti i,.ti em,.cal-rel{
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
}

/* ---- topbar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{color:var(--accent);font-size:22px;line-height:1}
.title{font-weight:800;letter-spacing:.06em;font-size:17px}
.sub{color:var(--muted);font-size:12px;margin-top:1px}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;color:var(--muted);border:none;padding:8px 14px;
  border-radius:6px;font-size:14px;cursor:pointer;font-weight:600}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.on{color:var(--text);background:var(--panel2)}

/* ---- ticker ---- */
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:#0a0e13;
  white-space:nowrap;padding:9px 0}
.ticker-track{display:inline-flex;gap:34px;animation:scroll 42s linear infinite;padding-left:24px}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{font-size:13.5px;color:var(--muted)}
.ti b{color:var(--text);font-weight:600;margin-right:7px}
.ti i{font-style:normal;color:var(--muted);margin-left:2px}
.ti em{font-style:normal;margin-left:8px;font-weight:700}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

/* ---- layout ---- */
.layout{display:grid;grid-template-columns:190px 1fr;gap:0;max-width:1280px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--line);
  position:sticky;top:64px;height:fit-content}
.side button{text-align:left;background:transparent;border:none;color:var(--muted);
  padding:9px 12px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500}
.side button:hover{color:var(--text);background:var(--panel)}
.side button.on{color:var(--text);background:var(--panel);box-shadow:inset 2px 0 0 var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;padding:20px 24px;align-content:start}

/* ---- card ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#33404d}
.card.open{border-color:var(--accent);grid-column:1/-1}
@media(max-width:900px){.card.open{grid-column:auto}}
.card-head{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:10px;
  align-items:baseline;padding:15px 16px 8px;background:transparent;border:none;
  cursor:pointer;text-align:left;color:inherit}
.card-name{color:var(--text);font-size:14px;font-weight:600;line-height:1.25}
.chev{color:var(--accent);margin-left:7px;font-weight:700}
.card-val{white-space:nowrap}
.num{font-size:22px;font-weight:700;letter-spacing:-.01em}
.unit{color:var(--muted);font-size:12px;margin-left:3px}
.card-delta{font-size:13px;font-weight:700;white-space:nowrap}
.card-meta{display:flex;gap:12px;align-items:center;padding:0 16px 13px;
  font-size:11.5px;color:var(--muted)}
.card-meta a{color:var(--muted);text-decoration:none;border-bottom:1px dotted #3a4550}
.card-meta a:hover{color:var(--text)}
.card-meta .us{margin-left:auto;color:#5a6b7d;font-style:italic}

.card-body{padding:4px 16px 18px;border-top:1px solid var(--line);animation:reveal .22s ease}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.desc{color:var(--muted);font-size:13px;line-height:1.5;margin:12px 0 0}
.breakdown{margin-top:16px;background:var(--panel2);border-radius:8px;padding:12px 14px}
.bd-title{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:10px}
.bd-row{display:grid;grid-template-columns:1fr auto 56px;gap:10px;align-items:baseline;
  padding:7px 0;border-top:1px solid var(--line)}
.bd-row:first-of-type{border-top:none}
.bd-name{font-size:13.5px;color:var(--text)}
.bd-val{font-size:14px;font-weight:600;text-align:right}
.bd-delta{font-size:13px;font-weight:700;text-align:right}

/* ---- calendar ---- */
.calendar,.about{max-width:900px;margin:0 auto;padding:28px 24px}
.cal-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.cal-head h2{margin:0;font-size:20px}
.muted{color:var(--muted)}.small{font-size:12px}
.cal-list{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-row{display:grid;grid-template-columns:160px 1fr auto;gap:16px;align-items:center;
  background:var(--panel);padding:14px 18px}
.cal-row.imp-high{box-shadow:inset 3px 0 0 var(--accent)}
.cal-date{}
.cal-day{font-size:14px;font-weight:600}
.cal-rel{font-size:12px;color:var(--muted);margin-top:2px}
.cal-title{font-size:14px}
.cal-src{font-size:12px;color:var(--muted);background:var(--panel2);padding:3px 9px;border-radius:5px}

/* ---- about ---- */
.about h2{font-size:20px;margin:0 0 10px}
.about p{color:var(--text);line-height:1.6;font-size:14px}
.about ul{list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:12px}
.about li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;
  font-size:13.5px;line-height:1.5;color:var(--muted)}
.about li b{color:var(--text)}
.about a{color:var(--accent);text-decoration:none}
.about a:hover{text-decoration:underline}

/* ---- footer ---- */
.foot{display:flex;justify-content:space-between;max-width:1280px;margin:0 auto;
  padding:20px 24px 40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:30px}

@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;position:static;border-right:none;
    border-bottom:1px solid var(--line);padding:12px}
  .side button{white-space:nowrap}
  .cal-row{grid-template-columns:1fr;gap:6px}
  .tabs button{padding:8px 10px;font-size:13px}
}
